[project]
name = "ai-devcamp-rowing-coach-agent"
version = "0.1.0"
description = "ADK Agent for Masters Rowing Season Planning, Threshold Calculation, and Intervals.icu Scheduling"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a,eval]==2.4.0",
    "google-genai==2.11.0",
    "python-dotenv==1.2.2",
    "fastmcp==3.4.4",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
